<!DOCTYPE html>
<html>
    <head>
        <title> registration</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
        <h1>event registration</h1>
        </header>
        <nav>
            <a href="index.html">home</a>
            <a href="event.html">events</a>
            <a href="registration.html">registration</a>
            <a href="contact.html">contact</a>
        </nav>
        <div class="content">
            <h2>student registration</h2>
            <form onsubmit="registerstudent(event)">
                <label>name:</label>
                <input type="text" id="name" required>
                 <label>email:</label>
                <input type="email"  required>
                 <label>department:</label>
                <input type="text" required>
                 <label>select event:</label>
                <select id="event" required>
                    <option value="">select event</option>
                    <option>web devolopment workshop</option>
                    <option>quize competition</option>
                    <option>coding competition</option>
                </select>
                <button type="submit">register</button>
            </form>
             <p id="message"></p>
        </div>
        <script>
            function registerstudent(event){
                event.preventDefault();
                let name=document.getElementById("name").value;
                let eventName=document.getElementById("event").value;
                document.getElementById("message").innerHTML="successfily registered<br>"+
                "welcome"+name+"<br>"+
                "event"+ eventName;
                document.getElementById("message").style.display="block";
            }
        </script>
    </body>
</html>
